name: Checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        go: ['1.26.x', stable]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: ${{ matrix.go }}
          cache: false # No external dependencies or go.sum.
      - name: Format and vet
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
      - run: go test -race -cover ./...
      - name: Check out v0.1.0 for consumer tests
        if: matrix.go == '1.26.x'
        uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/v0.1.0
          path: .compat-baseline
          persist-credentials: false
      - name: Test consumer API against v0.1.0 and the checkout
        if: matrix.go == '1.26.x'
        working-directory: testdata/consumer
        run: |
          for source in "$GITHUB_WORKSPACE/.compat-baseline" "$GITHUB_WORKSPACE"; do
            dir=$(mktemp -d "$RUNNER_TEMP/consumer.XXXXXX")
            (cd "$dir" && go work init)
            GOWORK="$dir/go.work" go work use . "$source"
            GOWORK="$dir/go.work" go test -count=1 -v ./...
          done
      - name: Test 32-bit arithmetic
        run: GOARCH=386 go test ./...
      - name: Test Linux live capture on loopback
        if: matrix.go == '1.26.x'
        run: |
          for arch in amd64 386; do
            GOARCH="$arch" go test -c -o "$RUNNER_TEMP/live.test" .
            sudo setcap cap_net_raw=ep "$RUNNER_TEMP/live.test"
            "$RUNNER_TEMP/live.test" -test.v -test.run '^TestLive(StatsLoopback|Linux.*|CaptureConcurrentCloseUnblocksReadPacket)$'
          done
      - name: Bounded fuzz smoke tests
        if: matrix.go == 'stable'
        shell: bash
        run: |
          targets=$(go test -list '^Fuzz' . | sed -n '/^Fuzz[[:alnum:]_]*$/p')
          test -n "$targets"
          for target in $targets; do
            go test -run '^$' -fuzz "^${target}$" -fuzztime=10s -parallel=2 .
          done

  platform-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: stable
          cache: false
      - run: go test ./...
      - name: Test macOS datalink discovery with BPF access
        if: matrix.os == 'macos-latest'
        env:
          GO_PCAP_TEST_REQUIRE_BPF: '1'
        run: |
          go test -c -o "$RUNNER_TEMP/live-bpf.test" .
          sudo -n chmod 0400 /dev/bpf[0-9]*
          sudo -n chown "$(id -u)" /dev/bpf[0-9]*
          "$RUNNER_TEMP/live-bpf.test" -test.v -test.run '^TestLiveDevicesDarwinLoopback$'

  vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: stable
          cache: false
      - name: Install pinned vulnerability checker
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Check library and standard library
        run: govulncheck -test ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: stable
          cache: false
      - name: Install pinned golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - name: Lint root module
        run: golangci-lint run ./...
