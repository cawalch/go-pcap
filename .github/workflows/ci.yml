name: Go
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  ci:
    # Gate the entire suite so unrelated labels cannot emit skipped required checks.
    if: >-
      github.actor_id == '795605' && github.triggering_actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-ci')
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/checks.yml
