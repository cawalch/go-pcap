name: Linux runner pilot
on:
  push:
    branches: [ci/linux-runner-smoke]
permissions:
  contents: read
jobs:
  linux:
    runs-on: [self-hosted, linux, x64, go-pcap-110]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.x'
          cache: false
      - name: Run native Linux tests
        run: |
          set -eu
          go version
          go vet ./...
          go test -race -cover ./...
          GOARCH=386 go test ./...
      - name: Verify kernel counters with loopback traffic
        run: |
          set -eu
          for arch in amd64 386; do
            GOARCH="$arch" go test -c -o "$RUNNER_TEMP/live.test" .
            sudo -n setcap cap_net_raw=ep "$RUNNER_TEMP/live.test"
            "$RUNNER_TEMP/live.test" -test.v -test.run '^TestLiveStatsLoopback$' | tee "$RUNNER_TEMP/loopback.log"
            grep -F -- '--- PASS: TestLiveStatsLoopback' "$RUNNER_TEMP/loopback.log"
          done
