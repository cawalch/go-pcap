name: Go
on:
  push:
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      matrix:
        go: ['1.26.x', stable]
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["self-hosted","linux","x64","go-pcap-110"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: ${{ matrix.go }}
          cache: false # No external dependencies or go.sum.
      - name: Format and vet
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
      - run: go test -race -cover ./...
      - name: Test 32-bit arithmetic
        run: GOARCH=386 go test ./...
      - name: Test Linux live counters on loopback
        if: matrix.go == '1.26.x'
        run: |
          for arch in amd64 386; do
            GOARCH="$arch" go test -c -o "$RUNNER_TEMP/live.test" .
            sudo setcap cap_net_raw=ep "$RUNNER_TEMP/live.test"
            "$RUNNER_TEMP/live.test" -test.v -test.run '^TestLiveStatsLoopback$'
          done
      - name: Bounded fuzz smoke tests
        if: matrix.go == 'stable'
        shell: bash
        run: |
          targets=$(go test -list '^Fuzz' . | sed -n '/^Fuzz[[:alnum:]_]*$/p')
          test -n "$targets"
          for target in $targets; do
            go test -run '^$' -fuzz "^${target}$" -fuzztime=10s -parallel=2 .
          done

  platform-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: stable
          cache: false
      - run: go test ./...

  vulnerabilities:
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["self-hosted","linux","x64","go-pcap-110"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: stable
          cache: false
      - name: Install pinned vulnerability checker
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Check library and standard library
        run: govulncheck -test ./...

  lint:
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["self-hosted","linux","x64","go-pcap-110"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: stable
          cache: false
      - name: Install pinned golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - name: Lint root module
        run: golangci-lint run ./...
